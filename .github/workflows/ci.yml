name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile Python modules
        run: |
          python -m py_compile \
            chatgpt_mirror.py \
            mirror_js.py \
            mirror_models.py \
            mirror_storage.py \
            mirror_web.py \
            mirror_widgets.py

