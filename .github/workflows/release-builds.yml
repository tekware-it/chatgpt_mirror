name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-appimage
            artifact_glob: dist/*.AppImage
          - os: windows-latest
            artifact_name: windows-portable
            artifact_glob: dist/*.zip
          - os: macos-latest
            artifact_name: macos-dmg
            artifact_glob: dist/*.dmg

    env:
      CHATGPT_MIRROR_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download linuxdeploy tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -L https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o "$HOME/.local/bin/linuxdeploy"
          curl -L https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$HOME/.local/bin/appimagetool"
          chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/build_linux_appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 ./packaging/build_linux_appimage.sh

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/build_windows.ps1

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Show collected files
        run: find release-artifacts -maxdepth 3 -type f | sort

      - name: Publish/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.zip
            release-artifacts/**/*.dmg
          generate_release_notes: true
